services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      API_AUTH_REQUIRED: "true"
      AUTH_MODE: api_key
      API_KEY: change-me-for-production
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AUDIT_LOG_PATH: /app/backend/app/data_registry/audit/audit_events.jsonl
      DATASET_REGISTRY_BACKEND: sqlite
      DATASET_REGISTRY_SQLITE_PATH: /app/backend/app/data_registry/registry.sqlite3
    volumes:
      - ./backend/app/data_registry:/app/backend/app/data_registry

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - api
